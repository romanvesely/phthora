name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ffmpeg shipped with the Windows and macOS downloads: fixed builds, checked by SHA-256
  WIN_FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0.zip
  WIN_FFMPEG_SHA256: 3da6c7b60bb9ccd73ec5b5e815ba804a0879eb362ba0e3beebce50174c022696
  MAC_FFMPEG_BASE: https://ffmpeg.martin-riedl.de/download/macos
  MAC_ARM64: arm64/1789931890_9.0.2
  MAC_AMD64: amd64/1789931006_9.0.2

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo build --release -p phthora
      - name: Package
        run: |
          set -euo pipefail
          ver=$(cargo pkgid -p phthora | sed 's/.*[#@]//')
          name=phthora-$ver-linux-x86_64
          mkdir -p dist "$name/assets"
          cp target/release/phthora README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES packaging/phthora.desktop "$name/"
          cp assets/icon/phthora.png "$name/"
          cp -r assets/video "$name/assets/"
          tar -czf "dist/$name.tar.gz" "$name"

          # AppImage: the program with its assets beside it, icon and desktop entry at the top
          app=AppDir
          mkdir -p "$app/usr/bin"
          cp target/release/phthora "$app/usr/bin/"
          cp -r "$name/assets" "$app/usr/bin/"
          cp packaging/phthora.desktop assets/icon/phthora.png "$app/"
          ln -s usr/bin/phthora "$app/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          curl -fsSL -o runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime" | sha256sum -c -
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --runtime-file runtime "$app" "dist/phthora-$ver-x86_64.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --release -p phthora
      - name: Package
        run: |
          set -euo pipefail
          ver=$(cargo pkgid -p phthora | sed 's/.*[#@]//')
          name=phthora-$ver-windows-x86_64
          mkdir -p dist "$name/assets" "$name/ffmpeg"
          cp target/release/phthora.exe README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES "$name/"
          cp -r assets/video "$name/assets/"
          curl -fsSL -o ffmpeg.zip "$WIN_FFMPEG_URL"
          echo "$WIN_FFMPEG_SHA256  ffmpeg.zip" | sha256sum -c -
          unzip -q ffmpeg.zip -d ffmpeg-src
          src=$(ls -d ffmpeg-src/*/)
          cp "$src"bin/ffmpeg.exe "$src"bin/ffprobe.exe "$src"bin/*.dll "$name/ffmpeg/"
          cp "$src"LICENSE.txt "$name/ffmpeg/LICENSE.txt"
          7z a -tzip -mx=9 "dist/$name.zip" "$name" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo build --release -p phthora --target aarch64-apple-darwin
      - run: cargo build --release -p phthora --target x86_64-apple-darwin
      - name: Package
        run: |
          set -euo pipefail
          ver=$(cargo pkgid -p phthora | sed 's/.*[#@]//')
          app=phthora.app/Contents
          mkdir -p dist "$app/MacOS" "$app/Resources/assets" "$app/Resources/ffmpeg"
          lipo -create -output "$app/MacOS/phthora" target/aarch64-apple-darwin/release/phthora target/x86_64-apple-darwin/release/phthora
          cp -r assets/video "$app/Resources/assets/"
          cp assets/icon/phthora.icns "$app/Resources/"
          # one universal ffmpeg and ffprobe from the arm64 and x86_64 builds
          for tool in ffmpeg ffprobe; do
            for arch in "$MAC_ARM64" "$MAC_AMD64"; do
              dir=dl/${arch%%/*}
              mkdir -p "$dir"
              curl -fsSL -o "$dir/$tool.zip" "$MAC_FFMPEG_BASE/$arch/$tool.zip"
            done
          done
          shasum -a 256 -c - <<SUMS
          c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924  dl/arm64/ffmpeg.zip
          fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6  dl/arm64/ffprobe.zip
          7c6b4125b191cbf773832dc51f424cf2b6bb7da43007d1e066f95909e47cacd4  dl/amd64/ffmpeg.zip
          2322438ed2f6319a691291b247d09c69dcaa3a982460d1f269a7e1af335cfdfd  dl/amd64/ffprobe.zip
          SUMS
          for tool in ffmpeg ffprobe; do
            for a in arm64 amd64; do unzip -q -o "dl/$a/$tool.zip" -d "dl/$a"; done
            lipo -create -output "$app/Resources/ffmpeg/$tool" "dl/arm64/$tool" "dl/amd64/$tool"
          done
          sed "s/@VERSION@/$ver/g" packaging/Info.plist > "$app/Info.plist"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES "$app/Resources/"
          # not notarised: an ad-hoc signature lets it run after "Open" in the Finder
          codesign --force --deep --sign - phthora.app
          ditto -c -k --keepParent phthora.app "dist/phthora-$ver-macos-universal.zip"
          mkdir dmg && cp -R phthora.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname phthora -srcfolder dmg -ov -format UDZO "dist/phthora-$ver-macos-universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*

  publish:
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          set -euo pipefail
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          # the release text is the message of the annotated tag
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)' > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: dist/*
