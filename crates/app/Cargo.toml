[package]
name = "phthora"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Real-time GPU effect mixer for images, video and GIFs"

[[bin]]
name = "phthora"
path = "src/main.rs"

[dependencies]
dirs = "6.0.0"
open = "5.3.3"
eframe = "0.37"
phthora-audio = { path = "../audio" }
phthora-core = { path = "../core" }
phthora-gpu = { path = "../gpu" }
phthora-media = { path = "../media" }
phthora-seg = { path = "../seg" }
rand = "0.9"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
wgpu = "30.0.1"
