[workspace]
resolver = "3"
members = ["crates/core", "crates/gpu", "crates/media", "crates/audio", "crates/seg", "crates/app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
